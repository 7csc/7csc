name: Render Artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 00:00 JST

jobs:
  render:
    name: Render landscape, almanac and footer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Render SVGs from GitHub data
        run: python3 assets/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: re-render profile artwork"
          git push
